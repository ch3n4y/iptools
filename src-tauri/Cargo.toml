[package]
name = "iptools"
version = "1.0.5"
description = "IP 地址修改器 — Windows 网络配置工具"
authors = ["ch3n4y"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "iptools"
path = "src/main.rs"
# The binary carries the requireAdministrator manifest; unit tests live in the lib.
test = false

[lib]
# The `_lib` suffix avoids a name clash with the binary (see rust-lang/cargo#8519).
name = "iptools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
once_cell = "1"
rand = "0.10"
csv = "1"
calamine = "0.36"
winreg = "0.56.0"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Networking_WinSock",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 1
