name: Release

# Tag pushes build the Windows installer plus the updater artifacts
# (.exe / .sig / latest.json) and publish them as a GitHub Release.
# The in-app updater reads:
#   https://github.com/ch3n4y/iptools/releases/latest/download/latest.json
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "IP 地址修改器 ${{ github.ref_name }}"
          releaseBody: |
            请阅读仓库中的 README.md 与 docs/功能对照.md 了解功能与差异。

            安装包与自动更新均由此工作流产出；已安装用户可在「设置 → 自动更新」中检查更新。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target x86_64-pc-windows-msvc

      # tauri-action only uploads latest.json when it can match a signature to an
      # updater bundle; generate the manifest explicitly so the in-app updater
      # always has an endpoint (the asset name is resolved from the release
      # because non-ASCII installer names are sanitised by GitHub).
      - name: Publish updater manifest (latest.json)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $assets = gh release view $tag --repo $repo --json assets | ConvertFrom-Json
          $installer = $assets.assets | Where-Object { $_.name -like "*-setup.exe" } | Select-Object -First 1
          if (-not $installer) { throw "未找到安装包资产" }
          $sigFile = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe.sig | Select-Object -First 1
          if (-not $sigFile) { throw "未找到签名文件" }
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()
          $manifest = [ordered]@{
            version   = $version
            notes     = "IP 地址修改器 $tag"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = "https://github.com/$repo/releases/download/$tag/$($installer.name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path latest.json -Encoding utf8
          gh release upload $tag latest.json --repo $repo --clobber
          Get-Content latest.json
